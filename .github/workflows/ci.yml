name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Local integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # System libraries for the headless Chromium used by the passkey flow test.
      - run: npx playwright install-deps chromium
      - run: npm run test:local

  checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Prettier check, ESLint and type checking. The type check also fails when the compatibility
      # date or flags changed without running npm run types:workers.
      - run: npm run check

  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: iac
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.11.4'
      - run: terraform fmt -check
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate
      # TFLint with the ruleset bundled in it (iac/.tflint.hcl). The checksum is the SHA-256 of
      # tflint_linux_amd64.zip in the release's checksums.txt; update it together with the version.
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.65.0
          checksums: d4c545ed2e29d6338604b586f34f544f380f70f243aa72f7b484713835eaec61
      - run: tflint

  deploy:
    name: Deploy production
    needs: [test, checks, terraform]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.11.4'
      - name: Apply infrastructure using HCP state
        working-directory: iac
        env:
          TF_IN_AUTOMATION: 'true'
          TF_INPUT: 'false'
          TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
          TF_WORKSPACE: ${{ vars.TF_WORKSPACE }}
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$TF_CLOUD_ORGANIZATION"
          test -n "$TF_WORKSPACE"
          test -n "$TF_TOKEN_app_terraform_io"
          test -n "$TF_VAR_cloudflare_account_id"
          test -n "$CLOUDFLARE_API_TOKEN"
          terraform init -input=false -lockfile=readonly
          terraform state show cloudflare_d1_database.kintai_note > /dev/null
          terraform plan -input=false -out=deployment.tfplan
          terraform apply -input=false deployment.tfplan
      - name: Apply schema and deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler d1 time-travel info kintai-note
          npm run db:apply
          npx wrangler deploy
