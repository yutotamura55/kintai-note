name: Dependency review
on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Fails when the pull request adds or changes a runtime dependency with a known vulnerability
      # of high severity or above. Dependencies the pull request leaves as they are do not affect the
      # result. The action reads the dependency graph through the API, so it needs no checkout.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
