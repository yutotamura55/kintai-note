version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
        # A Wrangler update needs generated types (npm run types:workers), so it gets its own pull request.
        exclude-patterns:
          - wrangler
    ignore:
      # Keep the types on the Node major that CI builds with (node-version in ci.yml).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 stops ESLint: ts-api-utils fails while loading. Remove when the lint tools support it.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Whether to move to Nuxt 4 is decided in issue 73.
      - dependency-name: nuxt
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
