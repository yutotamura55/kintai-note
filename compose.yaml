services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/workspace
      - container_node_modules:/workspace/node_modules
      - container_nuxt:/workspace/.nuxt

volumes:
  container_node_modules:
  container_nuxt:
